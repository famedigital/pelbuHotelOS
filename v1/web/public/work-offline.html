<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <title>Offline | Pelbu Work</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f4f0e8;
        color: #0b1020;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 420px);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }
      p {
        color: #535866;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        width: 100%;
        margin-top: 20px;
        border: 0;
        border-radius: 14px;
        background: #0b1020;
        color: white;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Work is offline.</h1>
      <p>
        Reconnect before changing bookings, folios, room status, POS orders or
        staff records. Operational data is never cached on this device.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
